[mgr]
# NOTE: can be combined with tmTheme (sublime colorshceme file) for preview code highlight
# syntect_theme = "path/to/tmTheme"

cwd = { fg = "#7e85b8", italic = true }

# Hovered
hovered         = { bg = "#161440" }
preview_hovered = { bg = "#161440" }

# Find
 find_keyword  = { fg = "#09081a", bg = "#FB9B00", bold = true }
find_position = { fg = "#5352CD", bg = "#161440", bold = true }

# Marker
 marker_copied   = { fg = "#2A8A6B", bg = "#2A8A6B" }
 marker_cut      = { fg = "#E50050", bg = "#E50050" }
 marker_marked   = { fg = "#D91C87", bg = "#D91C87" }
 marker_selected = { fg = "#5352CD", bg = "#5352CD" }

# Count
 count_copied   = { fg = "#09081a", bg = "#2A8A6B" }
 count_cut      = { fg = "#09081a", bg = "#E50050" }
 count_selected = { fg = "#09081a", bg = "#5352CD" }

# Border
border_symbol = "│"
border_style  = { fg = "#3F3BF5" }

# Tab
[tabs]
 active   = { fg = "#070614", bg = "${syntax.title}" }
 inactive = { fg = "${syntax.title}", bg = "#312e55" }

[mode]
 normal_main = { fg = "#070614", bg = "${syntax.title}", bold = true }
 normal_alt  = { fg = "${syntax.title}", bg = "#312e55" }

 select_main = { fg = "#070614", bg = "#D91C87", bold = true }
 select_alt  = { fg = "#D91C87", bg = "#312e55" }

 unset_main  = { fg = "#070614", bg = "#D91C87", bold = true }
 unset_alt   = { fg = "#D91C87", bg = "#312e55" }

[status]
overall   = { fg = "#bec8e8", bg = "#09081a" }
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }

# Progress
progress_label  = { fg = "#bec8e8", bold = true }
progress_normal = { fg = "#161440", bg = "#161440" }
 progress_error  = { fg = "#E50050", bg = "#161440" }

# Permissions
 perm_type  = { fg = "#5352CD" }
perm_read  = { fg = "#FFD888" }
 perm_write = { fg = "#E50050" }
 perm_exec  = { fg = "#2A8A6B" }
perm_sep   = { fg = "#070614" }

[pick]
border   = { fg = "#3F3BF5" }
active   = { fg = "#bec8e8",  bg = "#161440" }
inactive = { fg = "#bec8e8" }

# Input
[input]
 border   = { fg = "#3F3BF5" }
 title    = { fg = "#3F3BF5" }
value    = { fg = "#834CCF" }
selected = { bg = "#161440" }

# Completion
[cmp]
 border   = { fg = "#3F3BF5" }
active   = { fg = "#bec8e8", bg = "#161440" }
inactive = { fg = "#bec8e8" }

icon_file    = ""
icon_folder  = ""
icon_command = ""

# Tasks
[tasks]
border  = { fg = "#3F3BF5" }
title   = { fg = "#3F3BF5" }
hovered = { fg = "#bec8e8", bg = "#161440" }

# Which
[which]
cols            = 3
mask            = { bg = "#09081a" }
cand            = { fg = "#33D4B4" }
rest            = { fg = "#3F3BF5" }
desc            = { fg = "#D91C87" }
separator       = " ➜ "
separator_style = { fg = "#5c6296" }

# Confirm
[confirm]
 border  = { fg = "#3F3BF5" }
title   = { fg = "#3F3BF5" }
content = {}
list    = {}
btn_yes = { bg = "#161440" }
btn_no  = {}
btn_labels = [ "  [Y]es  ", "  (N)o  " ]

# Spot
[spot]
border  = { fg = "#3F3BF5" }
title   = { fg = "#3F3BF5" }

# Notify
[notify]
title_info  = { fg = "#5352CD" }
title_warn  = { fg = "#FB9B00" }
title_error = { fg = "#E50050" }

icon_error = ""
icon_warn = ""
icon_info = ""

# Help
[help]
 on      = { fg = "#2A8A6B" }
 run     = { fg = "#D91C87" }
 desc    = { fg = "#33D4B4" }
hovered = { bg = "#161440" }
footer  = { fg = "#bec8e8", bg = "#0D0C25" }

[filetype]

rules = [
	# Images
	{ mime = "image/*", fg = "#FFD888" },

	# Media
	{ mime = "{audio,video}/*", fg = "#D91C87" },

	# Archives
	{ mime = "application/*zip", fg = "#E50050" },
	{ mime = "application/x-{tar,bzip*,7z-compressed,xz,rar}", fg = "#E50050" },

	# Documents
	{ mime = "application/{pdf,doc,rtf,vnd.*}", fg = "#33D4B4" },

	# Empty files
	# { mime = "inode/x-empty", fg = "#E50050" },

	# Special files
	{ name = "*", is = "orphan", bg = "#E50050" },
	{ name = "*", is = "exec"  , fg = "#2A8A6B" },

	# Fallback
	{ name = "*/", fg = "${syntax.title}" },
	{ name = "*", fg = "#bec8e8" }
]
    